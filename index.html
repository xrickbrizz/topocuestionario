<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topografía Aplicada — TP Nº1</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#17202a; --muted:#667085;
  --primary:#1769aa; --primary2:#0f4f80; --good:#198754; --bad:#dc3545;
  --border:#dfe4ea; --soft:#eef5fb; --shadow:0 10px 30px rgba(20,35,50,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,var(--primary2),var(--primary));color:white;padding:30px 18px}
.header-inner{max-width:1050px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}
.subtitle{margin:0;opacity:.9}
.container{max-width:1050px;margin:24px auto;padding:0 16px 50px}
.panel,.question-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.panel{padding:20px;margin-bottom:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
button{border:0;border-radius:10px;padding:11px 17px;font-weight:700;cursor:pointer;font-size:15px}
.primary{background:var(--primary);color:white}
.primary:hover{background:var(--primary2)}
.secondary{background:#e9eef3;color:#243342}
.danger{background:#fcebed;color:#a61b2b}
button:disabled{opacity:.5;cursor:not-allowed}
.progress-wrap{margin-top:16px}
.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:7px}
.progress{height:10px;background:#e7ebef;border-radius:20px;overflow:hidden}
.progress-bar{height:100%;width:0;background:var(--primary);transition:width .25s}
.question-card{padding:25px;margin-bottom:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:12px;padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--primary2);font-weight:700}
.badge.type{background:#f1f3f5;color:#495057}
.question-title{font-size:19px;font-weight:750;margin:0 0 18px}
.options{display:grid;gap:10px}
.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);padding:13px 14px;border-radius:12px;cursor:pointer;transition:.15s;background:white}
.option:hover{background:#fafcff;border-color:#b9c9d8}
.option input{margin-top:4px;accent-color:var(--primary);transform:scale(1.1)}
.option.correct{border-color:var(--good);background:#eaf7ef}
.option.incorrect{border-color:var(--bad);background:#fdecee}
.option.missed{border-color:#d99b25;background:#fff8e8}
.feedback{margin-top:16px;padding:15px;border-radius:12px;border-left:5px solid}
.feedback.good{background:#eaf7ef;border-color:var(--good)}
.feedback.bad{background:#fdecee;border-color:var(--bad)}
.feedback strong{display:block;margin-bottom:4px}
.explanation{margin-top:8px;color:#3f4b57}
.numeric-wrap{display:flex;gap:10px;align-items:center;max-width:500px}
.numeric-wrap input{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;font-size:16px}
.unit{font-weight:700;color:var(--muted);white-space:nowrap}
.question-actions{display:flex;justify-content:flex-end;margin-top:18px}
.result{display:none;text-align:center;padding:30px}
.score{font-size:54px;font-weight:800;color:var(--primary);margin:8px 0}
.score-message{font-size:18px;margin-bottom:18px}
.review-list{display:grid;gap:8px;text-align:left;margin-top:20px}
.review-item{padding:11px 13px;border-radius:10px;background:#f5f7f9}
.review-item.good{border-left:4px solid var(--good)}
.review-item.bad{border-left:4px solid var(--bad)}
.hidden{display:none!important}
.note{font-size:13px;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:25px}
@media(max-width:650px){
  .question-card{padding:18px}.controls{align-items:stretch}.controls button{width:100%}
  .numeric-wrap{max-width:none}.score{font-size:44px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Topografía Aplicada</h1>
    <p class="subtitle">Trabajo Práctico Nº1 · Nivelación, Punto Inaccesible y Medición Indirecta</p>
  </div>
</header>

<main class="container">
  <section class="panel" id="startPanel">
    <div class="controls">
      <div>
        <strong>Banco de 30 preguntas</strong>
        <div class="note">En cada intento se seleccionan 15 preguntas al azar.</div>
      </div>
      <button class="primary" id="startBtn">Comenzar nuevo intento</button>
    </div>
  </section>

  <section class="panel hidden" id="quizPanel">
    <div class="controls">
      <div><strong id="questionCounter">Pregunta 1 de 15</strong></div>
      <div class="note" id="answeredCounter">0 respondidas</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta"><span>Progreso</span><span id="progressText">0%</span></div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </section>

  <section id="questions"></section>

  <section class="panel hidden" id="finishPanel">
    <div class="result" style="display:block">
      <div class="note">RESULTADO FINAL</div>
      <div class="score" id="finalScore">0/100</div>
      <div class="score-message" id="scoreMessage"></div>
      <button class="primary" id="newAttemptBtn">Nuevo intento</button>
      <div class="review-list" id="reviewList"></div>
    </div>
  </section>

  <div class="footer">Topografía Aplicada · TP Nº1</div>
</main>

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function normalizeNumber(value){
  return parseFloat(String(value).trim().replace(",", "."));
}

function sameSet(a,b){
  if(a.length !== b.length) return false;
  const aa=[...a].sort((x,y)=>x-y), bb=[...b].sort((x,y)=>x-y);
  return aa.every((v,i)=>v===bb[i]);
}

function formatNumber(n){
  return Number(n).toLocaleString("es-AR",{maximumFractionDigits:4});
}

function correctLabel(q){
  if(q.tipo==="single") return q.opciones[q.correcta];
  if(q.tipo==="multiple") return q.correcta.map(i=>q.opciones[i]).join(" · ");
  return `${formatNumber(q.correcta)} ${q.unidad||""}`.trim();
}

function startQuiz(){
  currentQuestions = shuffle(questionBank).slice(0,15);
  currentIndex=0;
  answers=Array(15).fill(null);
  checked=Array(15).fill(false);
  scoreCount=0;
  startPanel.classList.add("hidden");
  finishPanel.classList.add("hidden");
  quizPanel.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion(){

  questionCounter.textContent=`Pregunta ${currentIndex+1} de ${currentQuestions.length}`;
  const answered=checked.filter(Boolean).length;

  progressText.textContent=`${pct}%`;

  questionsEl.innerHTML="";
  const card=document.createElement("article");
  card.className="question-card";

  const badges=document.createElement("div");
  badges.className="badges";
  badges.innerHTML=`<span class="badge">${q.tema}</span><span class="badge type">${q.tipo==="single"?"Opción única":q.tipo==="multiple"?"Múltiples opciones":"Respuesta numérica"}</span>`;
  card.appendChild(badges);

  const title=document.createElement("h2");
  title.className="question-title";
  title.textContent=`${q.id}. ${q.pregunta}`;
  card.appendChild(title);

  const inputArea=document.createElement("div");

  if(q.tipo==="single" || q.tipo==="multiple"){
    const opts=document.createElement("div");
    opts.className="options";
    q.opciones.forEach((text,i)=>{
      const label=document.createElement("label");
      label.className="option";
      const input=document.createElement("input");
      input.type=q.tipo==="single"?"radio":"checkbox";
      input.name=`q${q.id}`;
      input.value=i;
      const saved=answers[currentIndex];
      if(saved && saved.includes(i)) input.checked=true;
      input.addEventListener("change",()=>{
        if(q.tipo==="single"){
          answers[currentIndex]=[Number(input.value)];
        }else{
          answers[currentIndex]=Array.from(opts.querySelectorAll("input:checked")).map(x=>Number(x.value));
        }
      });
      const span=document.createElement("span");
      span.textContent=text;
      label.appendChild(input); label.appendChild(span);
      opts.appendChild(label);
    });
    inputArea.appendChild(opts);
  }else{
    const wrap=document.createElement("div");
    wrap.className="numeric-wrap";
    const input=document.createElement("input");
    input.type="text";
    input.inputMode="decimal";
    input.placeholder="Ingrese el resultado";
    input.setAttribute("aria-label","Respuesta numérica");
    if(answers[currentIndex] !== null) input.value=answers[currentIndex];
    input.addEventListener("input",()=>answers[currentIndex]=input.value);
    wrap.appendChild(input);
    if(q.unidad){
      const unit=document.createElement("span");
      unit.className="unit";
      unit.textContent=q.unidad;
      wrap.appendChild(unit);
    }
    inputArea.appendChild(wrap);
  }
  card.appendChild(inputArea);

  const feedback=document.createElement("div");
  feedback.id="feedback";
  if(checked[currentIndex]){
    showFeedback(feedback,q,answers[currentIndex]);
  }
  card.appendChild(feedback);

  const actions=document.createElement("div");
  actions.className="question-actions";
  const btn=document.createElement("button");
  btn.className="primary";
  btn.textContent=checked[currentIndex] ? (currentIndex===currentQuestions.length-1?"Finalizar":"Siguiente") : "Comprobar respuesta";
  btn.addEventListener("click",()=>handleQuestion(q,feedback));
  actions.appendChild(btn);
  card.appendChild(actions);

  questionsEl.appendChild(card);
}

function getAnswer(){
  const q=currentQuestions[currentIndex];
  if(q.tipo==="numeric"){
    const n=normalizeNumber(answers[currentIndex]);
    return Number.isFinite(n)?n:null;
  }
  return answers[currentIndex] || [];
}

function isCorrect(q,ans){
  if(q.tipo==="single") return ans.length===1 && ans[0]===q.correcta;
  if(q.tipo==="multiple") return sameSet(ans,q.correcta);
  return ans!==null && Math.abs(ans-q.correcta)<=q.tolerancia;
}

function showFeedback(container,q,ans){
  container.className="feedback";
  const ok=isCorrect(q,ans);
  container.classList.add(ok?"good":"bad");
  container.innerHTML="";
  const title=document.createElement("strong");
  title.textContent=ok?"✓ Correcto":"✗ Incorrecto";
  const answer=document.createElement("div");
  answer.innerHTML=`<b>Respuesta correcta:</b> ${escapeHtml(correctLabel(q))}`;
  const exp=document.createElement("div");
  exp.className="explanation";
  exp.textContent=q.explicacion;
  container.appendChild(title);
  container.appendChild(answer);
  container.appendChild(exp);
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function paintOptions(q,ok){
  document.querySelectorAll("#questions .option").forEach((label,i)=>{
    const input=label.querySelector("input");
    const idx=Number(input.value);
    if(q.tipo==="single"){
      if(idx===q.correcta) label.classList.add("correct");
      if(input.checked && idx!==q.correcta) label.classList.add("incorrect");
    }else{
      if(q.correcta.includes(idx)) label.classList.add("correct");
      if(input.checked && !q.correcta.includes(idx)) label.classList.add("incorrect");
      if(!input.checked && q.correcta.includes(idx)) label.classList.add("missed");
    }
    input.disabled=true;
  });
}

function handleQuestion(q,feedback){
  if(!checked[currentIndex]){
    const ans=getAnswer();
    if(q.tipo!=="numeric" && ans.length===0){
      alert("Seleccione al menos una opción antes de comprobar.");
      return;
    }
    if(q.tipo==="numeric" && ans===null){
      alert("Ingrese un valor numérico antes de comprobar.");
      return;
    }
    checked[currentIndex]=true;
    if(isCorrect(q,ans)) scoreCount++;
    showFeedback(feedback,q,ans);
    if(q.tipo!=="numeric") paintOptions(q,isCorrect(q,ans));
    feedback.scrollIntoView({behavior:"smooth",block:"nearest"});
    renderActionOnly();
    updateCounters();
  }else{
    if(currentIndex<currentQuestions.length-1){
      currentIndex++;
      renderQuestion();
      window.scrollTo({top:0,behavior:"smooth"});
    }else{
      finishQuiz();
    }
  }
}

function renderActionOnly(){
  const btn=document.querySelector(".question-actions button");
  if(btn) btn.textContent=currentIndex===currentQuestions.length-1?"Finalizar":"Siguiente";
}

function updateCounters(){
  const answered=checked.filter(Boolean).length;
  answeredCounter.textContent=`${answered} respondidas`;
  const pct=Math.round((answered/currentQuestions.length)*100);
  progressBar.style.width=`${pct}%`;
  progressText.textContent=`${pct}%`;
}

function finishQuiz(){
  progressBar.style.width="100%";
  progressText.textContent="100%";
  questionsEl.innerHTML="";
  quizPanel.classList.add("hidden");
  finishPanel.classList.remove("hidden");
  const points=(scoreCount/currentQuestions.length)*100;
  finalScore.textContent=`${Math.round(points)}/100`;
  if(points>=90) scoreMessage.textContent="Excelente. Tenés un dominio muy sólido de los temas.";
  else if(points>=70) scoreMessage.textContent="Muy bien. Solo quedan algunos conceptos por reforzar.";
  else if(points>=50) scoreMessage.textContent="Bien encaminado. Conviene repasar los temas en los que fallaste.";
  else scoreMessage.textContent="Hay varios conceptos para reforzar. Usá las explicaciones para repasar.";

  reviewList.innerHTML="";
  currentQuestions.forEach((q,i)=>{
    const item=document.createElement("div");
    item.className=`review-item ${isCorrect(q,getStoredAnswer(i))?"good":"bad"}`;
    item.innerHTML=`<b>${i+1}. ${escapeHtml(q.tema)}</b> — ${isCorrect(q,getStoredAnswer(i))?"Correcta":"Incorrecta"}<br><span class="note">Respuesta: ${escapeHtml(correctLabel(q))}</span>`;
    reviewList.appendChild(item);
  });
}

function getStoredAnswer(i){
  const q=currentQuestions[i];
  if(q.tipo==="numeric") return normalizeNumber(answers[i]);
  return answers[i]||[];
}

startBtn.addEventListener("click",startQuiz);
newAttemptBtn.addEventListener("click",()=>{
  window.scrollTo({top:0,behavior:"smooth"});
  startQuiz();
});
</script>
</body>
</html>
